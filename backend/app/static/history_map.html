<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire history grid</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font: 13px/1.4 system-ui, sans-serif; }
  #map { height: 100%; background: #dfe6ea; }
  #panel { position: absolute; z-index: 1000; bottom: 24px; left: 10px; width: 270px; padding: 10px 12px;
           background: rgba(255,255,255,.94); border-radius: 6px; box-shadow: 0 1px 6px rgba(0,0,0,.3); }
  #panel h1 { font-size: 14px; margin: 0 0 6px; }
  #panel input { width: 100%; }
  #month { font-weight: 600; font-size: 15px; }
  #stats, #hover { color: #444; margin-top: 4px; min-height: 18px; }
  #legend { height: 10px; margin-top: 8px; border-radius: 2px;
            background: linear-gradient(to right, #ffffb2, #fecc5c, #fd8d3c, #e31a1c, #7f0000); }
  #legend-labels { display: flex; justify-content: space-between; color: #555; font-size: 11px; }
  #msg { color: #b00020; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Past fires over India (cumulative)</h1>
  <div id="month"></div>
  <input id="slider" type="range" min="0" max="0" value="0">
  <div id="stats"></div>
  <div id="legend"></div>
  <div id="legend-labels"><span>1</span><span id="legend-max"></span></div>
  <div id="hover"></div>
  <div id="msg"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const API = "/api/v1/history";
const STOPS = [[255,255,178],[254,204,92],[253,141,60],[227,26,28],[127,0,0]];
const $ = id => document.getElementById(id);

const map = L.map("map", { zoomAnimation: false, minZoom: 4, maxZoom: 10 }).setView([22.5, 80], 5);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);

function colour(n, nmax) {
  const t = Math.min(1, Math.log(1 + n) / Math.log(1 + nmax));
  const x = t * (STOPS.length - 1), i = Math.min(STOPS.length - 2, Math.floor(x)), f = x - i;
  const c = STOPS[i].map((v, k) => Math.round(v + (STOPS[i + 1][k] - v) * f));
  return `rgba(${c[0]},${c[1]},${c[2]},0.8)`;
}

const canvas = L.DomUtil.create("canvas");
canvas.style.pointerEvents = "none";
map.getPanes().overlayPane.appendChild(canvas);
let data = null, nmax = 0, lookup = new Map();

function draw() {
  const size = map.getSize();
  L.DomUtil.setPosition(canvas, map.containerPointToLayerPoint([0, 0]));
  canvas.width = size.x;
  canvas.height = size.y;
  if (!data) return;
  const ctx = canvas.getContext("2d"), d = data.cell_deg;
  for (const [r, c, n] of data.cells) {
    const a = map.latLngToContainerPoint([(r + 1) * d, c * d]);
    const b = map.latLngToContainerPoint([r * d, (c + 1) * d]);
    if (b.x < 0 || a.x > size.x || b.y < 0 || a.y > size.y) continue;
    ctx.fillStyle = colour(n, nmax);
    ctx.fillRect(a.x, a.y, Math.max(1, b.x - a.x), Math.max(1, b.y - a.y));
  }
}
map.on("moveend zoomend resize", draw);

let months = [], latest = 0;

async function show() {
  const to = months[$("slider").value], mine = ++latest;
  $("month").textContent = "Up to " + new Date(to + "T00:00:00").toLocaleDateString("en-GB", { month: "short", year: "numeric" });
  const r = await fetch(`${API}/grid?to=${to}`);
  const d = await r.json();
  if (mine !== latest) return;
  if (!r.ok) { $("msg").textContent = d.error.message; return; }
  $("msg").textContent = "";
  nmax = nmax || d.max_count;
  $("legend-max").textContent = nmax.toLocaleString() + " fires/cell";
  $("stats").textContent = `${d.total_fires.toLocaleString()} fires in ${d.cell_count.toLocaleString()} cells`;
  lookup = new Map(d.cells.map(([r, c, n]) => [r * 100000 + c, n]));
  data = d;
  draw();
}

map.on("mousemove", e => {
  if (!data) return;
  const r = Math.floor(e.latlng.lat / data.cell_deg + 1e-9), c = Math.floor(e.latlng.lng / data.cell_deg + 1e-9);
  const n = lookup.get(r * 100000 + c);
  $("hover").textContent = n ? `${n.toLocaleString()} fires in this cell` : "";
});

$("slider").addEventListener("input", show);

(async () => {
  const r = await fetch(API + "/months");
  const j = await r.json();
  if (!r.ok) { $("msg").textContent = j.error.message; return; }
  let [y, m] = j.first.split("-").map(Number);
  const [ey, em] = j.last.split("-").map(Number);
  while (y < ey || (y === ey && m <= em)) {
    months.push(`${y}-${String(m).padStart(2, "0")}-01`);
    if (++m > 12) { m = 1; y++; }
  }
  $("slider").max = months.length - 1;
  $("slider").value = months.length - 1;
  show();
})();
</script>
</body>
</html>
