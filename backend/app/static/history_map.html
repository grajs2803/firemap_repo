<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire history grid</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font: 13px/1.4 system-ui, sans-serif; }
  #map { height: 100%; background: #dfe6ea; }
  #panel { position: absolute; z-index: 1000; bottom: 24px; left: 10px; width: 270px; padding: 10px 12px;
           background: rgba(255,255,255,.94); border-radius: 6px; box-shadow: 0 1px 6px rgba(0,0,0,.3); }
  #panel h1 { font-size: 14px; margin: 0 0 6px; }
  #panel input[type=range] { width: 100%; }
  #month { font-weight: 600; font-size: 15px; }
  #stats, #hover { color: #444; margin-top: 4px; min-height: 18px; }
  #legend { height: 10px; margin-top: 8px; border-radius: 2px;
            background: linear-gradient(to right, #ffffb2, #fecc5c, #fd8d3c, #e31a1c, #7f0000); }
  #legend-labels { display: flex; justify-content: space-between; color: #555; font-size: 11px; }
  #msg { color: #b00020; }
  #card { position: fixed; z-index: 1200; width: 272px; padding: 10px 12px; display: none; pointer-events: none;
          background: rgba(255,255,255,.97); border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  #card.stale { opacity: .55; }
  #card h2 { font-size: 14px; margin: 0; }
  #card .sub { color: #666; font-size: 11px; margin-bottom: 6px; }
  #card .sec { font-weight: 600; font-size: 12px; margin: 8px 0 2px; }
  #card .note { color: #666; font-size: 11px; }
  #card table { width: 100%; border-collapse: collapse; }
  #card td { padding: 1px 0; } #card td:last-child { text-align: right; font-weight: 600; }
  #card svg text { font: 10px system-ui, sans-serif; fill: #444; }
  .pill { display: inline-block; padding: 0 7px; border-radius: 9px; color: #fff; font-size: 11px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="card"></div>
<div id="panel">
  <h1>EmberGrid</h1>
  <label><input type="radio" name="mode" value="history" checked> History</label>
  <label><input type="radio" name="mode" value="risk"> Risk</label>
  <div id="month"></div>
  <input id="slider" type="range" min="0" max="0" value="0">
  <div id="stats"></div>
  <div id="legend"></div>
  <div id="legend-labels"><span id="legend-min">1</span><span id="legend-max"></span></div>
  <div id="hover"></div>
  <div id="msg"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const API = "/api/v1/history";
const DETAIL_ZOOM = 9;
const STOPS = [[255,255,178],[254,204,92],[253,141,60],[227,26,28],[127,0,0]];
const $ = id => document.getElementById(id);

const map = L.map("map", { zoomAnimation: false, minZoom: 4, maxZoom: 10 }).setView([22.5, 80], 5);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);

function colour(n, nmax) {
  const t = mode === "risk" ? Math.min(1, n / 0.5) : Math.min(1, Math.log(1 + n) / Math.log(1 + nmax));
  const x = t * (STOPS.length - 1), i = Math.min(STOPS.length - 2, Math.floor(x)), f = x - i;
  const c = STOPS[i].map((v, k) => Math.round(v + (STOPS[i + 1][k] - v) * f));
  return `rgba(${c[0]},${c[1]},${c[2]},0.8)`;
}

const canvas = L.DomUtil.create("canvas");
canvas.style.pointerEvents = "none";
map.getPanes().overlayPane.appendChild(canvas);
let data = null, nmax = 0, lookup = new Map();
let detail = null, dlookup = new Map(), dmax = 1, mode = "history", showRisk = null;
const view = () => (mode === "history" && detail && map.getZoom() >= DETAIL_ZOOM) ? detail : data;
const scale = () => view() === detail ? dmax : nmax;

function draw() {
  const size = map.getSize();
  L.DomUtil.setPosition(canvas, map.containerPointToLayerPoint([0, 0]));
  canvas.width = size.x;
  canvas.height = size.y;
  const v = view();
  if (!v) return;
  const ctx = canvas.getContext("2d"), d = v.cell_deg, top = scale();
  for (const [r, c, n] of v.cells) {
    const a = map.latLngToContainerPoint([(r + 1) * d, c * d]);
    const b = map.latLngToContainerPoint([r * d, (c + 1) * d]);
    if (b.x < 0 || a.x > size.x || b.y < 0 || a.y > size.y) continue;
    ctx.fillStyle = colour(n, top);
    ctx.fillRect(a.x, a.y, Math.max(1, b.x - a.x), Math.max(1, b.y - a.y));
  }
}
map.on("resize", draw);
map.on("moveend zoomend", () => { draw(); loadDetail(); });

let dticket = 0;
async function loadDetail() {
  if (mode !== "history" || map.getZoom() < DETAIL_ZOOM) { detail = null; draw(); legend(); return; }
  const b = map.getBounds(), mine = ++dticket;
  const bbox = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map(x => x.toFixed(4)).join(",");
  const r = await fetch(`${API}/detail?bbox=${bbox}&to=${months[$("slider").value]}`);
  const d = await r.json();
  if (mine !== dticket || mode !== "history") return;
  if (!r.ok) { $("msg").textContent = d.error.message; return; }
  $("msg").textContent = d.truncated ? "Too many cells here, zoom in further." : "";
  detail = d;
  dmax = Math.max(3, ...d.cells.map(x => x[2]));
  dlookup = new Map(d.cells.map(([r, c, n]) => [r * 100000 + c, n]));
  draw(); legend();
}

function legend() {
  const d = view() === detail;
  $("legend-min").textContent = mode === "risk" ? "0" : "1";
  $("legend-max").textContent = mode === "risk" ? "50%+ chance" : scale().toLocaleString() + (d ? " fires/0.01° cell" : " fires/cell");
}

let months = [], latest = 0;

async function show() {
  const to = months[$("slider").value], mine = ++latest;
  $("month").textContent = "Up to " + new Date(to + "T00:00:00").toLocaleDateString("en-GB", { month: "short", year: "numeric" });
  const r = await fetch(`${API}/grid?to=${to}`);
  const d = await r.json();
  if (mine !== latest) return;
  if (!r.ok) { $("msg").textContent = d.error.message; return; }
  $("msg").textContent = "";
  nmax = nmax || d.max_count;
  legend();
  $("stats").textContent = `${d.total_fires.toLocaleString()} fires in ${d.cell_count.toLocaleString()} cells`;
  lookup = new Map(d.cells.map(([r, c, n]) => [r * 100000 + c, n]));
  data = d;
  draw();
  loadDetail();
}

async function showRiskLayer() {
  const mine = ++latest;
  const r = await fetch(`${API}/risk`);
  const d = await r.json();
  if (mine !== latest || mode !== "risk") return;
  if (!r.ok) { $("msg").textContent = d.error.message; return; }
  $("msg").textContent = "";
  $("month").textContent = "Risk on " + d.date;
  $("stats").textContent = `model ${d.model}, ${d.cells.length.toLocaleString()} cells (only pilot areas have predictions)`;
  showRisk = d;
  data = d;
  lookup = new Map(d.cells.map(([r, c, p]) => [r * 100000 + c, p]));
  draw();
  legend();
}

document.querySelectorAll("input[name=mode]").forEach(el => el.addEventListener("change", () => {
  mode = el.value;
  $("slider").style.display = mode === "risk" ? "none" : "";
  $("msg").textContent = "";
  data = null; detail = null; draw();
  mode === "risk" ? showRiskLayer() : show();
}));

const card = $("card"), cache = new Map(), LEVEL = { low: "#2e7d32", moderate: "#f9a825", high: "#ef6c00", extreme: "#b71c1c" };
let hoverTimer = null, hoverCtl = null, shownKey = null, last = { x: 0, y: 0 };

function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmt(v, d = 2, unit = "") { return v == null ? "n/a" : (+v).toFixed(d) + unit; }

function chart(bars) {
  const W = 248, H = 84, base = 66, top = 12, max = Math.max(1, ...bars.map(b => b.n)), bw = W / bars.length;
  const parts = bars.map((b, i) => {
    const h = b.n ? Math.max(2, (b.n / max) * (base - top)) : 0, x = i * bw + 4;
    return `<rect x="${x}" y="${base - h}" width="${bw - 8}" height="${h}" fill="#e31a1c" opacity="${b.partial ? .55 : 1}"><title>${b.year}${b.partial ? " (partial year)" : ""}: ${b.n} fires</title></rect>` +
      (b.n ? `<text x="${x + (bw - 8) / 2}" y="${base - h - 2}" text-anchor="middle">${b.n}</text>` : "") +
      `<text x="${x + (bw - 8) / 2}" y="${base + 12}" text-anchor="middle">${b.year}${b.partial ? "*" : ""}</text>`;
  });
  return `<svg width="${W}" height="${H}"><line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="#bbb"/>${parts.join("")}</svg>`;
}

function render(d) {
  const f = d.fires, l = d.latest, p = d.place;
  let h = `<h2>${esc(p ? p.label : "Unnamed area")}</h2><div class="sub">${d.cell_id ? esc(d.cell_id) + " &middot; " : ""}${d.lat.toFixed(3)}, ${d.lon.toFixed(3)}${d.elevation != null ? " &middot; " + Math.round(d.elevation) + " m" : ""}</div>`;
  h += `<div class="sec">Fires per year (${f.total.toLocaleString()} in total)</div>${chart(f.yearly)}`;
  h += `<div class="note">${esc(f.area)}; * = part of the year (data ${f.from} to ${f.to})</div>`;
  if (l) {
    h += `<div class="sec">Conditions on ${l.date}</div><table>` +
      `<tr><td>NDVI (vegetation)</td><td>${fmt(l.ndvi)}</td></tr><tr><td>Fire weather index</td><td>${fmt(l.fwi, 1)}</td></tr>` +
      `<tr><td>Temperature</td><td>${fmt(l.temp_c, 1, " &deg;C")}</td></tr><tr><td>Rainfall</td><td>${fmt(l.rainfall_mm, 1, " mm")}</td></tr>` +
      `<tr><td>Wind</td><td>${fmt(l.wind_speed, 1, " m/s")}</td></tr>` +
      `<tr><td>Predicted risk</td><td>${(l.risk.probability * 100).toFixed(1)}% <span class="pill" style="background:${LEVEL[l.risk.level]}">${l.risk.level}</span></td></tr></table>`;
  } else {
    h += `<div class="note" style="margin-top:6px">No daily conditions here (only the pilot districts have them).</div>`;
  }
  card.innerHTML = h;
}

function place(x, y) {
  const w = card.offsetWidth, hh = card.offsetHeight;
  card.style.left = Math.max(8, Math.min(x + 18, innerWidth - w - 8)) + "px";
  card.style.top = Math.max(8, Math.min(y + 18, innerHeight - hh - 8)) + "px";
}

async function loadCard(latlng) {
  const deg = view() === detail ? 0.01 : 0.1;
  const key = `${deg}:${Math.floor(latlng.lat / 0.01 + 1e-9)}:${Math.floor(latlng.lng / 0.01 + 1e-9)}`;
  if (key === shownKey) { card.classList.remove("stale"); return; }
  let d = cache.get(key);
  if (!d) {
    if (hoverCtl) hoverCtl.abort();
    hoverCtl = new AbortController();
    try {
      const r = await fetch(`${API}/point?lat=${latlng.lat.toFixed(5)}&lon=${latlng.lng.toFixed(5)}&deg=${deg}`, { signal: hoverCtl.signal });
      if (!r.ok) { card.style.display = "none"; return; }
      d = await r.json();
      if (cache.size > 300) cache.clear();
      cache.set(key, d);
    } catch (e) { return; }
  }
  if (!d.place && !d.fires.total) { card.style.display = "none"; shownKey = null; return; }
  shownKey = key;
  render(d);
  card.classList.remove("stale");
  card.style.display = "block";
  place(last.x, last.y);
}

function hideCard() { clearTimeout(hoverTimer); if (hoverCtl) hoverCtl.abort(); card.style.display = "none"; shownKey = null; }

let moving = false;
map.on("movestart zoomstart", () => { moving = true; hideCard(); });
map.on("moveend zoomend", () => { moving = false; });

map.on("mousemove", e => {
  last = { x: e.originalEvent.clientX, y: e.originalEvent.clientY };
  if (moving) return;
  const v = view();
  if (v) {
    const r = Math.floor(e.latlng.lat / v.cell_deg + 1e-9), c = Math.floor(e.latlng.lng / v.cell_deg + 1e-9);
    const n = (v === detail ? dlookup : lookup).get(r * 100000 + c);
    $("hover").textContent = !n ? "" : mode === "risk" ? `${(n * 100).toFixed(1)}% mean fire probability` : `${n.toLocaleString()} fires in this cell`;
  }
  if (card.style.display === "block") { card.classList.add("stale"); place(last.x, last.y); }
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => loadCard(e.latlng), 180);
});
map.on("mouseout", hideCard);

$("slider").addEventListener("input", show);

(async () => {
  const r = await fetch(API + "/months");
  const j = await r.json();
  if (!r.ok) { $("msg").textContent = j.error.message; return; }
  let [y, m] = j.first.split("-").map(Number);
  const [ey, em] = j.last.split("-").map(Number);
  while (y < ey || (y === ey && m <= em)) {
    months.push(`${y}-${String(m).padStart(2, "0")}-01`);
    if (++m > 12) { m = 1; y++; }
  }
  $("slider").max = months.length - 1;
  $("slider").value = months.length - 1;
  show();
})();
</script>
</body>
</html>
